<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهمات لؤي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3aa58c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مهمات لؤي">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#e8f1ed;--c1:#ffffff;--c2:#f3f8f6;--tx:#1d3832;--mut:#6f8d85;--p1:#3aa58c;--p2:#2a8670;--pd:#1c6454;--acc:#f0b84f;--accd:#c88f27;--dng:#d9604f;--bd:#d5e5de;--sh:rgba(34,86,72,.16);--hl:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101b18;--c1:#1d2e29;--c2:#172622;--tx:#e3f1ec;--mut:#8caa9f;--p1:#46b096;--p2:#2f937c;--pd:#1d6a59;--bd:#2a433c;--sh:rgba(0,0,0,.5);--hl:#2b413a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;background:var(--bg);color:var(--tx);padding-bottom:110px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
header{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--p1),var(--pd));color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 20px 64px;border-radius:0 0 32px 32px;box-shadow:0 12px 26px var(--sh)}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
header:before{width:170px;height:170px;top:-60px;left:-40px}header:after{width:110px;height:110px;bottom:-40px;right:30px}
header h1{margin:0;font-size:22px;position:relative}header small{opacity:.85;position:relative;font-size:13px}
main{padding:0 16px;margin-top:-44px;position:relative}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border-radius:22px;padding:16px;margin:0 0 16px;border:1px solid var(--bd);box-shadow:0 1px 0 var(--hl) inset,0 12px 26px var(--sh),0 2px 5px var(--sh)}
.card h2{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
.bot{display:flex;gap:12px;align-items:center;line-height:1.7}
.av{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--acc),var(--accd));color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #a2711a,0 8px 14px var(--sh);flex:0 0 44px}
.ring{display:flex;align-items:center;gap:16px}.ring svg.r{width:92px;height:92px;flex:0 0 92px;filter:drop-shadow(0 6px 6px var(--sh))}
.big{font-size:22px;font-weight:700;color:var(--p2)}.mut{color:var(--mut);font-size:13px}
input,select{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;box-shadow:inset 0 3px 6px var(--sh);outline:none}
input:focus{border-color:var(--p1)}
label.l{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
button{font:inherit;border:0;cursor:pointer;color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2));border-radius:16px;padding:13px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 var(--pd),0 10px 16px var(--sh);transition:.08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pd),0 3px 6px var(--sh)}
button.alt{background:linear-gradient(180deg,var(--c1),var(--c2));color:var(--tx);box-shadow:0 4px 0 var(--bd),0 8px 14px var(--sh);border:1px solid var(--bd)}
button.alt:active{box-shadow:0 1px 0 var(--bd)}
button.ic{background:none;box-shadow:none;color:var(--mut);padding:8px;border-radius:12px}button.ic:active{transform:scale(.88)}
button[disabled]{opacity:.45;pointer-events:none}.dng{color:var(--dng)!important}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}.t:last-of-type{border:0}
.cb{width:30px;height:30px;padding:0;flex:0 0 30px;border-radius:10px;background:var(--bg);color:transparent;box-shadow:inset 0 3px 6px var(--sh),0 1px 0 var(--hl)}
.cb.on{background:linear-gradient(180deg,var(--p1),var(--p2));color:#fff;box-shadow:0 3px 0 var(--pd),0 6px 10px var(--sh)}
.n{flex:1;font-size:15px;line-height:1.5}.t.d .n{text-decoration:line-through;color:var(--mut)}
.tag{display:inline-block;font-size:11px;border-radius:8px;padding:2px 8px;margin-inline-start:6px;background:var(--acc);color:#5a4308}
.imp{color:var(--accd);width:18px;height:18px}
.seg{display:flex;gap:10px;margin-top:12px}.seg button{flex:1;background:var(--bg);color:var(--mut);box-shadow:inset 0 3px 6px var(--sh)}
.seg button.on{background:linear-gradient(180deg,var(--p1),var(--p2));color:#fff;box-shadow:0 4px 0 var(--pd)}
nav{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:16px;right:16px;display:flex;gap:6px;padding:8px;border-radius:26px;background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--bd);box-shadow:0 14px 30px var(--sh),0 1px 0 var(--hl) inset;z-index:5}
nav button{flex:1;flex-direction:column;gap:3px;font-size:12px;padding:9px 4px;background:none;color:var(--mut);box-shadow:none}
nav button.on{color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2));box-shadow:0 4px 0 var(--pd)}
.sheet{position:fixed;inset:0;background:rgba(10,25,20,.5);display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--c1);width:100%;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px var(--sh)}
.empty{text-align:center;color:var(--mut);padding:24px 0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="archive" viewBox="0 0 24 24"><path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/></symbol>
<symbol id="restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></symbol>
<symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
<symbol id="vol" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM16 9a4 4 0 0 1 0 6"/></symbol>
<symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="phone" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12.01" y2="18"/></symbol>
</defs></svg>
<header><h1>مهمات لؤي</h1><small id="sub"></small></header>
<main><div class="card bot"><div class="av"><svg class="i"><use href="#spark"/></svg></div><div id="msg"></div></div><div id="app"></div></main>
<nav id="nav"></nav><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),H=3600000,D=86400000;
const I=(n,c)=>`<svg class="i ${c||''}"><use href="#${n}"/></svg>`;
const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
let S;try{S=JSON.parse(localStorage.getItem('ml2'))}catch(e){}
S=Object.assign({plan:null,draft:[],archive:[],days:1,every:1,from:8,to:22,sound:'bell',last:0,tab:'tasks'},S||{});
S.draft=S.draft.map(x=>typeof x=='string'?{t:x,p:0}:x);
const save=()=>{try{localStorage.setItem('ml2',JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pend=()=>S.plan?S.plan.tasks.filter(t=>!t.done):[];
const TONES={bell:[880,1320],soft:[523,659,784],alarm:[740,520,740,520],drop:[1046,784]};
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();let t=c.currentTime;(TONES[S.sound]||TONES.bell).forEach(f=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.32);t+=.28})}catch(e){}if(navigator.vibrate)navigator.vibrate(120)}
const remindText=()=>{const p=pend().sort((a,b)=>b.p-a.p);return p.length?`عليك ${p.length} مهمة: `+p.slice(0,4).map(t=>t.t).join('، '):'لا توجد مهام متبقية'};
const inWin=d=>d.getHours()>=S.from&&d.getHours()<=S.to;
function notify(b){beep();if(!LN&&window.Notification&&Notification.permission==='granted'){try{new Notification('مهمات لؤي',{body:b})}catch(e){}}$('#msg').textContent=b}
async function schedule(){if(!LN)return;try{const pn=await LN.getPending();if(pn.notifications.length)await LN.cancel(pn);if(!pend().length)return;
 const L=[],now=new Date();let id=1;for(let d=0;d<30&&L.length<60;d++)for(let h=S.from;h<=S.to&&L.length<60;h+=S.every){const at=new Date(now.getFullYear(),now.getMonth(),now.getDate()+d,h,0,0);if(at>now)L.push({id:id++,title:'مهمات لؤي',body:remindText(),schedule:{at,allowWhileIdle:true},channelId:'tasks'})}
 if(L.length)await LN.schedule({notifications:L})}catch(e){}}
async function initN(){if(LN){try{await LN.requestPermissions();await LN.createChannel({id:'tasks',name:'تذكير المهام',importance:5,vibration:true})}catch(e){}}else if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}
function rollover(){const P=S.plan;if(!P||Date.now()<P.start+P.days*D)return;const un=P.tasks.filter(t=>!t.done);
 P.tasks.filter(t=>t.done).forEach(t=>S.archive.unshift({t:t.t,p:t.p,at:Date.now()}));
 S.plan=un.length?{start:P.start+Math.floor((Date.now()-P.start)/(P.days*D))*P.days*D,days:P.days,tasks:un.map(t=>({...t,carry:(t.carry||0)+1}))}:null;save();schedule();render();
 notify(un.length?`انتهت المدة، انتقلت ${un.length} مهمة غير مكتملة إلى الفترة التالية`:'أنهيت كل المهام، أحسنت!')}
function assist(){const p=pend().sort((a,b)=>b.p-a.p),P=S.plan,m=$('#msg');
 if(!P){m.textContent='مرحباً لؤي! أضف مهامك، اختر عدد الأيام وكل كم ساعة أذكّرك، وأنا معك.';return}
 const tot=P.tasks.length,d=tot-p.length,car=p.filter(t=>t.carry).length;
 m.textContent=!p.length?'ما شاء الله، أنهيت كل مهامك! أرشفها واستمتع بوقتك.':(d?`أنجزت ${d} من ${tot}. التالي: ${p[0].t}`:`ابدأ بـ: ${p[0].t}. خطوة واحدة تكفي.`)+(car?` — ${car} مؤجلة من قبل`:'')}
function fmt(ms){ms=Math.max(0,ms);const d=Math.floor(ms/D),h=Math.floor(ms%D/H),m=Math.floor(ms%H/60000);return(d?d+' يوم ':'')+h+' س '+m+' د'}
function ask(title,val,pri,cb){let P=pri||0;$('#modal').innerHTML=`<div class="sheet"><div><h2 style="margin:0 0 12px;font-size:17px">${title}</h2><input id="mi" value="${esc(val)}" placeholder="اكتب المهمة">
<div class="seg"><button onclick="setP(0)" class="${P?'':'on'}">${I('list')}عادية</button><button onclick="setP(1)" class="${P?'on':''}">${I('flag')}مهمة</button></div>
<div class="row"><button onclick="okM()">${I('check')}حفظ</button><button class="alt" onclick="$('#modal').innerHTML=''">إلغاء</button></div></div></div>`;
 window.setP=p=>{P=p;document.querySelectorAll('.seg button').forEach((b,i)=>b.classList.toggle('on',i==p))};
 window.okM=()=>{const v=$('#mi').value.trim();$('#modal').innerHTML='';if(v)cb(v,P)};setTimeout(()=>$('#mi').focus(),60)}
const go=t=>{S.tab=t;save();render()};
const flag=p=>p?I('flag','imp'):'';
function setup(){return `<div class="card" style="border:1px solid var(--p1);background:linear-gradient(180deg,var(--c1),#e8f4f0)">
 <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
  <div class="av" style="width:38px;height:38px;flex:0 0 38px">${I('phone')}</div>
  <div><strong style="font-size:15px;display:block">تثبيت التطبيق على الهاتف</strong><small class="mut">يعمل دائماً بدون إنترنت وبدون الحاجة للحاسوب</small></div>
 </div>
 <button class="alt" style="width:100%" onclick="installPWA()">${I('phone')}📱 تثبيت على الشاشة الرئيسية</button>
 </div>
 <div class="card"><h2>${I('list')}مهام جديدة</h2>${S.draft.length?S.draft.map((x,i)=>`<div class="t"><span class="n">${flag(x.p)} ${esc(x.t)}</span><button class="ic" onclick="editD(${i})">${I('edit')}</button><button class="ic dng" onclick="S.draft.splice(${i},1);save();render()">${I('trash')}</button></div>`).join(''):'<div class="empty">لا توجد مهام بعد</div>'}
 <div class="row"><button class="alt" onclick="ask('مهمة جديدة','',0,(v,p)=>{S.draft.push({t:v,p});save();render()})">${I('plus')}إضافة مهمة</button></div></div>
 <div class="card"><h2>${I('clock')}التوقيت</h2><div class="grid">
 <div><label class="l">المدة (أيام)</label><input type="number" min="1" value="${S.days}" onchange="S.days=Math.max(1,+this.value||1);save()"></div>
 <div><label class="l">تذكير كل (ساعات)</label><input type="number" min="1" max="12" value="${S.every}" onchange="S.every=Math.max(1,+this.value||1);save()"></div>
 <div><label class="l">من الساعة</label><input type="number" min="0" max="23" value="${S.from}" onchange="S.from=Math.min(23,Math.max(0,+this.value||0));save()"></div>
 <div><label class="l">إلى الساعة</label><input type="number" min="0" max="23" value="${S.to}" onchange="S.to=Math.min(23,Math.max(0,+this.value||0));save()"></div></div>
 <div class="row"><button onclick="start()" ${S.draft.length?'':'disabled'}>${I('play')}ابدأ</button></div></div>`}
function ring(f){const r=36,c=2*Math.PI*r;return `<svg class="r" viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--p1)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}" transform="rotate(-90 46 46)"/><text x="46" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="var(--tx)">${Math.round(f*100)}%</text></svg>`}
function tasksView(){if(!S.plan)return setup();const P=S.plan,tot=P.tasks.length,d=tot-pend().length,L=[...P.tasks].sort((a,b)=>a.done-b.done||b.p-a.p);
 return `<div class="card ring">${ring(tot?d/tot:0)}<div><div class="mut">المتبقي من المدة</div><div class="big" id="cd"></div><div class="mut">${d} / ${tot} مكتملة · تذكير كل ${S.every} س</div></div></div>
 <div class="card"><h2>${I('list')}مهماتي</h2>${L.map(t=>`<div class="t ${t.done?'d':''}"><button class="cb ${t.done?'on':''}" onclick="tog(${t.id})">${I('check')}</button><span class="n">${flag(t.p)} ${esc(t.t)}${t.carry?`<span class="tag">مؤجلة ×${t.carry}</span>`:''}</span>
 ${t.done?`<button class="ic" onclick="arch(${t.id})">${I('archive')}</button>`:`<button class="ic" onclick="edit(${t.id})">${I('edit')}</button>`}<button class="ic dng" onclick="del(${t.id})">${I('trash')}</button></div>`).join('')}
 <div class="row"><button class="alt" onclick="ask('مهمة جديدة','',0,(v,p)=>{S.plan.tasks.push({id:Date.now(),t:v,p,done:false,carry:0});chg()})">${I('plus')}إضافة</button>${P.tasks.some(t=>t.done)?`<button class="alt" onclick="archAll()">${I('archive')}أرشفة المكتملة</button>`:''}</div></div>`}
function archView(){return `<div class="card"><h2>${I('archive')}الأرشيف (${S.archive.length})</h2>${S.archive.length?S.archive.map((a,i)=>`<div class="t d"><span class="n">${esc(a.t)}<div class="mut">${new Date(a.at).toLocaleDateString('ar')}</div></span><button class="ic" onclick="restore(${i})">${I('restore')}</button><button class="ic dng" onclick="if(confirm('حذف نهائي؟')){S.archive.splice(${i},1);save();render()}">${I('trash')}</button></div>`).join(''):'<div class="empty">الأرشيف فارغ</div>'}
 ${S.archive.length?`<div class="row"><button class="alt dng" onclick="if(confirm('مسح كل الأرشيف؟')){S.archive=[];save();render()}">${I('trash')}مسح الأرشيف</button></div>`:''}</div>`}
function setView(){return `<div class="card" style="border:1px solid var(--p1);background:linear-gradient(180deg,var(--c1),#e8f4f0)">
 <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
  <div class="av" style="width:38px;height:38px;flex:0 0 38px">${I('phone')}</div>
  <div><strong style="font-size:15px;display:block">تثبيت التطبيق على هاتفك</strong><small class="mut">يعمل كتطبيق كامل بدون إنترنت ومستقل تماماً</small></div>
 </div>
 <button class="alt" style="width:100%" onclick="installPWA()">${I('phone')}📱 تثبيت على الشاشة الرئيسية</button>
 </div>
 <div class="card"><h2>${I('vol')}الصوت</h2><div class="row" style="margin-top:0"><select onchange="S.sound=this.value;save();beep()">${[['bell','جرس'],['soft','هادئ'],['alarm','منبه'],['drop','قطرة']].map(([k,n])=>`<option value="${k}" ${S.sound==k?'selected':''}>${n}</option>`).join('')}</select><button class="alt" style="flex:0" onclick="notify('هذا تنبيه تجريبي')">${I('bell')}تجربة</button></div></div>
 <div class="card"><h2>${I('clock')}التذكير</h2><div class="grid"><div><label class="l">كل (ساعات)</label><input type="number" min="1" max="12" value="${S.every}" onchange="S.every=Math.max(1,+this.value||1);save();schedule()"></div><div><label class="l">المدة (أيام)</label><input type="number" min="1" value="${S.plan?S.plan.days:S.days}" onchange="S.days=Math.max(1,+this.value||1);if(S.plan)S.plan.days=S.days;save()"></div>
 <div><label class="l">من الساعة</label><input type="number" min="0" max="23" value="${S.from}" onchange="S.from=+this.value;save();schedule()"></div><div><label class="l">إلى الساعة</label><input type="number" min="0" max="23" value="${S.to}" onchange="S.to=+this.value;save();schedule()"></div></div>
 ${S.plan?`<div class="row"><button class="alt dng" onclick="if(confirm('إنهاء الخطة الحالية؟')){S.plan=null;chg()}">${I('stop')}إنهاء الخطة</button></div>`:''}</div>`}
function render(){$('#app').innerHTML={tasks:tasksView,arch:archView,set:setView}[S.tab]();
 $('#nav').innerHTML=[['tasks','list','المهام'],['arch','archive','الأرشيف'],['set','sliders','الإعدادات']].map(([k,i,n])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')">${I(i)}${n}</button>`).join('');
 $('#sub').textContent=S.plan?`${pend().length} مهمة متبقية`:'نظّم وقتك بهدوء';tick()}
const tick=()=>{const c=$('#cd');if(c&&S.plan)c.textContent=fmt(S.plan.start+S.plan.days*D-Date.now())};
const chg=()=>{save();schedule();render();assist()};
function start(){S.plan={start:Date.now(),days:S.days,tasks:S.draft.map((x,i)=>({id:Date.now()+i,t:x.t,p:x.p,done:false,carry:0}))};S.draft=[];S.last=Date.now();initN().then(schedule);save();render();assist()}
const find=id=>S.plan.tasks.find(x=>x.id==id);
const tog=id=>{const t=find(id);t.done=!t.done;chg()};
const edit=id=>{const t=find(id);ask('تعديل المهمة',t.t,t.p,(v,p)=>{t.t=v;t.p=p;chg()})};
const editD=i=>{const x=S.draft[i];ask('تعديل المهمة',x.t,x.p,(v,p)=>{S.draft[i]={t:v,p};save();render()})};
const drop=()=>{if(!S.plan.tasks.length)S.plan=null};
const del=id=>{if(!confirm('حذف المهمة؟'))return;S.plan.tasks=S.plan.tasks.filter(x=>x.id!=id);drop();chg()};
const arch=id=>{const t=find(id);S.archive.unshift({t:t.t,p:t.p,at:Date.now()});S.plan.tasks=S.plan.tasks.filter(x=>x.id!=id);drop();chg()};
const archAll=()=>{S.plan.tasks.filter(t=>t.done).forEach(t=>S.archive.unshift({t:t.t,p:t.p,at:Date.now()}));S.plan.tasks=S.plan.tasks.filter(t=>!t.done);drop();chg()};
const restore=i=>{const a=S.archive.splice(i,1)[0];if(S.plan)S.plan.tasks.push({id:Date.now(),t:a.t,p:a.p||0,done:false,carry:0});else S.draft.push({t:a.t,p:a.p||0});S.tab='tasks';chg()};
setInterval(()=>{rollover();tick();if(S.plan&&pend().length&&inWin(new Date())&&Date.now()-S.last>=S.every*H){S.last=Date.now();save();notify(remindText())}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollover();render();assist()}});
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
let defPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();defPrompt=e});
function showGuide(){
 $('#modal').innerHTML=`<div class="sheet"><div>
 <h2 style="margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px">${I('phone')} تثبيت التطبيق على هاتفك</h2>
 <div style="line-height:1.8;color:var(--tx);font-size:14px;margin-bottom:16px">
 <strong>📱 لهواتف أندرويد (Google Chrome):</strong><br>
 اضغط على قائمة المتصفح (<strong>⋮</strong> في الزاوية) ثم اختر <strong>"تثبيت التطبيق"</strong> أو <strong>"إضافة إلى الشاشة الرئيسية"</strong>.<br><br>
 <strong>🍎 لهواتف آيفون (Safari):</strong><br>
 اضغط على زر المشاركة (مربع بسهم لأعلى) ثم اختر <strong>"إضافة إلى الصفحة الرئيسية"</strong>.<br><br>
 <span class="tag" style="margin:0">✓ يعمل بدون إنترنت</span> <span class="tag" style="margin:0">✓ يعمل بدون حاسوب</span>
 </div>
 <button style="width:100%" onclick="$('#modal').innerHTML=''">${I('check')} حسناً، فهمت</button>
 </div></div>`;
}
function installPWA(){
 if(defPrompt){
  defPrompt.prompt();
  defPrompt.userChoice.then(()=>{defPrompt=null});
 }else{
  showGuide();
 }
}
rollover();render();assist();schedule();
</script>
